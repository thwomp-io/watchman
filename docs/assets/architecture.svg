<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 610" width="1240" height="610" role="img"
     aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title id="t">How Watchman works</title>
  <desc id="d">Plain files you own and public data sources feed a deterministic engine. The engine's commands
  fill a web console and publish events to a bus that pushes alerts to your devices. An optional agent on
  your own machine reads through the same commands, sealed to read-only, and answers in the console's chat tab.</desc>
  <style>
    .bg    { fill: #ffffff; stroke: #d1d9e0; }
    .card  { fill: #f6f8fa; stroke: #d1d9e0; }
    .inner { fill: #ffffff; stroke: #d1d9e0; }
    .core  { fill: #f3f8ff; stroke: #0969da; }
    .agent { fill: #fbf8ff; stroke: #8250df; stroke-dasharray: 6 5; }
    .h     { fill: #1f2328; font-size: 17px; font-weight: 600; }
    .k     { fill: #59636e; font-size: 11px; font-weight: 600; letter-spacing: 0.09em; }
    .t     { fill: #1f2328; font-size: 13.5px; }
    .m     { fill: #59636e; font-size: 12.5px; }
    .c     { fill: #1f2328; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .ln    { stroke: #59636e; stroke-width: 1.6; fill: none; }
    .lnb   { stroke: #0969da; stroke-width: 1.8; fill: none; }
    .lnp   { stroke: #8250df; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; }
    .ah    { fill: #59636e; }
    .ahb   { fill: #0969da; }
    .ahp   { fill: #8250df; }
    .lab   { fill: #59636e; font-size: 12px; }
    .blue  { fill: #0969da; }
    .purp  { fill: #8250df; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; stroke: #3d444d; }
      .card  { fill: #151b23; stroke: #3d444d; }
      .inner { fill: #0d1117; stroke: #3d444d; }
      .core  { fill: #0f1a2b; stroke: #4493f8; }
      .agent { fill: #17132a; stroke: #ab7df8; }
      .h, .t, .c { fill: #f0f6fc; }
      .k, .m, .lab { fill: #9198a1; }
      .ln    { stroke: #9198a1; }
      .lnb   { stroke: #4493f8; }
      .lnp   { stroke: #ab7df8; }
      .ah    { fill: #9198a1; }
      .ahb   { fill: #4493f8; }
      .ahp   { fill: #ab7df8; }
      .blue  { fill: #4493f8; }
      .purp  { fill: #ab7df8; }
    }
  </style>
  <defs>
    <marker id="a"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="ah"  d="M0,1 L9,5 L0,9 z"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="ahb" d="M0,1 L9,5 L0,9 z"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="ahp" d="M0,1 L9,5 L0,9 z"/></marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="1239" height="609" rx="12"/>

  <!-- column headings -->
  <text class="k" x="40"  y="44">WHAT GOES IN</text>
  <text class="k" x="370" y="44">THE ENGINE</text>
  <text class="k" x="900" y="44">WHAT YOU LOOK AT</text>

  <!-- inputs -->
  <rect class="card" x="40" y="62" width="250" height="176" rx="10"/>
  <text class="h" x="60" y="94">Your files</text>
  <text class="m" x="60" y="116">Plain YAML and Markdown you own</text>
  <text class="c" x="60" y="148">finance/portfolio.yaml</text>
  <text class="c" x="60" y="170">career/watchlist.yml</text>
  <text class="c" x="60" y="192">travel/trips/</text>
  <text class="m" x="60" y="220">or a bundled sample persona</text>

  <rect class="card" x="40" y="270" width="250" height="150" rx="10"/>
  <text class="h" x="60" y="302">Public sources</text>
  <text class="m" x="60" y="324">Read-only requests, no accounts</text>
  <text class="t" x="60" y="354">prices · filings · the calendar</text>
  <text class="t" x="60" y="376">job boards · pay data</text>
  <text class="t" x="60" y="398">flights · events · weather</text>

  <!-- engine -->
  <rect class="core" x="370" y="62" width="450" height="358" rx="10" stroke-width="1.6"/>
  <text class="h" x="392" y="94">Engine</text>
  <text class="c blue" x="456" y="94">hn</text>
  <text class="m" x="392" y="116">One lane per domain, the same layers in each</text>

  <rect class="inner" x="392" y="134" width="126" height="38" rx="19"/>
  <text class="t" x="455" y="158" text-anchor="middle">finance</text>
  <rect class="inner" x="532" y="134" width="126" height="38" rx="19"/>
  <text class="t" x="595" y="158" text-anchor="middle">career</text>
  <rect class="inner" x="672" y="134" width="126" height="38" rx="19"/>
  <text class="t" x="735" y="158" text-anchor="middle">travel</text>

  <rect class="inner" x="392" y="196" width="406" height="44" rx="8"/>
  <text class="t" x="410" y="223"><tspan font-weight="600">Providers</tspan><tspan class="m" dx="10">one module per outside source</tspan></text>
  <path class="ln" d="M595,240 L595,256" marker-end="url(#a)"/>
  <rect class="inner" x="392" y="258" width="406" height="44" rx="8"/>
  <text class="t" x="410" y="285"><tspan font-weight="600">Service</tspan><tspan class="m" dx="10">one surface per lane, typed models</tspan></text>
  <path class="ln" d="M595,302 L595,318" marker-end="url(#a)"/>
  <rect class="inner" x="392" y="320" width="406" height="44" rx="8"/>
  <text class="t" x="410" y="347"><tspan font-weight="600">CLI + MCP</tspan><tspan class="m" dx="10">the same verbs for people and agents</tspan></text>

  <text class="t blue" x="392" y="394" font-weight="600">Deterministic. Read-only by default.</text>
  <text class="m" x="392" y="410" font-size="11.5">No model in a render loop or an alert path.</text>

  <!-- outputs -->
  <rect class="card" x="900" y="62" width="300" height="212" rx="10"/>
  <text class="h" x="920" y="94">Console</text>
  <text class="m" x="920" y="116">One page, served from your machine</text>
  <text class="t" x="920" y="148">Dashboards · Inbox · Vault · Chat</text>
  <rect class="inner" x="920" y="168" width="82" height="34" rx="17"/>
  <text class="t" x="961" y="190" text-anchor="middle">browser</text>
  <rect class="inner" x="1010" y="168" width="74" height="34" rx="17"/>
  <text class="t" x="1047" y="190" text-anchor="middle">phone</text>
  <rect class="inner" x="1092" y="168" width="88" height="34" rx="17"/>
  <text class="t" x="1136" y="190" text-anchor="middle">desktop</text>
  <text class="m" x="920" y="232">One token, on your private network.</text>
  <text class="m" x="920" y="250">Nothing is hosted for you.</text>

  <rect class="card" x="900" y="316" width="300" height="104" rx="10"/>
  <text class="h" x="920" y="348">Bus</text>
  <text class="m" x="920" y="372">Scheduled jobs publish events here.</text>
  <text class="m" x="920" y="392">Alerts push to your devices.</text>

  <!-- agent -->
  <rect class="agent" x="370" y="476" width="450" height="96" rx="10" stroke-width="1.6"/>
  <text class="h" x="392" y="508">Your agent <tspan class="m" font-weight="400" dx="4">optional</tspan></text>
  <text class="m" x="392" y="532">Runs on your own machine and plan. Sealed read-only by the</text>
  <text class="m" x="392" y="550">runner and the OS sandbox, not by the prompt.</text>

  <!-- flows -->
  <path class="ln"  d="M290,150 L366,150" marker-end="url(#a)"/>
  <path class="ln"  d="M290,345 L366,345" marker-end="url(#a)"/>
  <path class="lnb" d="M820,150 L896,150" marker-end="url(#ab)"/>
  <text class="lab" x="858" y="140" text-anchor="middle">views</text>
  <path class="lnb" d="M820,368 L896,368" marker-end="url(#ab)"/>
  <text class="lab" x="858" y="358" text-anchor="middle">events</text>
  <path class="lnb" d="M1050,316 L1050,278" marker-end="url(#ab)"/>

  <path class="lnp" d="M595,476 L595,424" marker-end="url(#ap)"/>
  <text class="lab purp" x="607" y="454">reads through the same commands</text>
  <path class="lnp" d="M820,524 L1220,524 L1220,120 L1204,120" marker-end="url(#ap)"/>
  <text class="lab purp" x="1020" y="514" text-anchor="middle">replies in the Chat tab</text>
</svg>
