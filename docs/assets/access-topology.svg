<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="2000" height="940" role="img"
     aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title id="t">One server, every device</title>
  <desc id="d">An always-on machine runs one server that holds your files, the engine and its scheduled jobs.
  A browser, a phone and the desktop app all open the same console page from it over your private network,
  with one token. Without an always-on machine, the desktop app starts its own local server.</desc>
  <style>
    .bg    { fill: #ffffff; stroke: #d1d9e0; }
    .card  { fill: #f6f8fa; stroke: #d1d9e0; }
    .inner { fill: #ffffff; stroke: #d1d9e0; }
    .core  { fill: #f3f8ff; stroke: #0969da; }
    .agent { fill: #fbf8ff; stroke: #8250df; stroke-dasharray: 6 5; }
    .h     { fill: #1f2328; font-size: 18.5px; font-weight: 600; }
    .k     { fill: #59636e; font-size: 12px; font-weight: 600; letter-spacing: 0.09em; }
    .t     { fill: #1f2328; font-size: 15px; }
    .m     { fill: #59636e; font-size: 13.5px; }
    .c     { fill: #1f2328; font-size: 13.5px; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .ln    { stroke: #59636e; stroke-width: 1.6; fill: none; }
    .lnb   { stroke: #0969da; stroke-width: 1.8; fill: none; }
    .lnp   { stroke: #8250df; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; }
    .ah    { fill: #59636e; }
    .ahb   { fill: #0969da; }
    .ahp   { fill: #8250df; }
    .lab   { fill: #59636e; font-size: 13px; }
    .blue  { fill: #0969da; }
    .purp  { fill: #8250df; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; stroke: #3d444d; }
      .card  { fill: #151b23; stroke: #3d444d; }
      .inner { fill: #0d1117; stroke: #3d444d; }
      .core  { fill: #0f1a2b; stroke: #4493f8; }
      .agent { fill: #17132a; stroke: #ab7df8; }
      .h, .t, .c { fill: #f0f6fc; }
      .k, .m, .lab { fill: #9198a1; }
      .ln    { stroke: #9198a1; }
      .lnb   { stroke: #4493f8; }
      .lnp   { stroke: #ab7df8; }
      .ah    { fill: #9198a1; }
      .ahb   { fill: #4493f8; }
      .ahp   { fill: #ab7df8; }
      .blue  { fill: #4493f8; }
      .purp  { fill: #ab7df8; }
    }
  </style>
  <defs>
    <marker id="a"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="ah"  d="M0,1 L9,5 L0,9 z"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="ahb" d="M0,1 L9,5 L0,9 z"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="ahp" d="M0,1 L9,5 L0,9 z"/></marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="999" height="469" rx="12"/>

  <text class="k" x="40"  y="44">ONE SERVER</text>
  <text class="k" x="420" y="44">YOUR NETWORK</text>
  <text class="k" x="640" y="44">EVERY DEVICE</text>

  <rect class="core" x="40" y="62" width="320" height="296" rx="10" stroke-width="1.6"/>
  <text class="h" x="62" y="94">Always-on machine</text>
  <text class="m" x="62" y="116">Your files, the engine, the scheduled jobs</text>
  <rect class="inner" x="62" y="138" width="276" height="44" rx="8"/>
  <text class="c" x="80" y="165">hn bus serve --console</text>
  <text class="t" x="62" y="214">One port. One token.</text>
  <text class="m" x="62" y="238">Serves the console page, its API and</text>
  <text class="m" x="62" y="256">the event bus.</text>
  <text class="m" x="62" y="290">Binds localhost unless you give it a</text>
  <text class="m" x="62" y="308">private address. Every API route</text>
  <text class="m" x="62" y="326">requires the token.</text>

  <rect class="agent" x="420" y="62" width="160" height="296" rx="10" stroke-width="1.4" style="stroke-dasharray: 4 5"/>
  <text class="t" x="500" y="162" text-anchor="middle" font-weight="600">Private network</text>
  <text class="m" x="500" y="258" text-anchor="middle">a mesh, a VPN</text>
  <text class="m" x="500" y="276" text-anchor="middle">or your LAN</text>

  <rect class="card" x="640" y="62" width="320" height="84" rx="10"/>
  <text class="h" x="660" y="94">Browser</text>
  <text class="m" x="660" y="118">The console at one address, on any device</text>

  <rect class="card" x="640" y="168" width="320" height="84" rx="10"/>
  <text class="h" x="660" y="200">Phone</text>
  <text class="m" x="660" y="224">Installs as an app; alerts arrive as push</text>

  <rect class="card" x="640" y="274" width="320" height="84" rx="10"/>
  <text class="h" x="660" y="306">Desktop app</text>
  <text class="m" x="660" y="330">The same page, plus a tray inbox and</text>
  <text class="m" x="660" y="346">native notifications</text>

  <path class="lnb" d="M360,104 L636,104" marker-end="url(#ab)"/>
  <path class="lnb" d="M360,210 L636,210" marker-end="url(#ab)"/>
  <path class="lnb" d="M360,316 L636,316" marker-end="url(#ab)"/>

  <rect class="card" x="40" y="390" width="920" height="50" rx="10"/>
  <text class="t" x="62" y="420"><tspan font-weight="600">No always-on machine?</tspan><tspan class="m" dx="10">The desktop app starts its own local server and shows the same console in a window.</tspan></text>
</svg>
