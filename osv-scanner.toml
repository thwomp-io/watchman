# osv-scanner config for the release gate — the ACCEPTED no-fix
# advisories, each with the reason a reader can check. Anything NOT listed here fails the gate,
# fixable or not, so a new advisory is a decision at tag time rather than a CI surprise (the
# v0.12.0 precedent: Trivy caught two HIGH uv.lock deps the local gate never scanned).
#
# The Tauri-GTK cluster: tauri 2.x on Linux pins gtk-rs 0.18, whose atk/gdk/gtk crates are flagged
# "unmaintained" (RUSTSEC-2024-041x/042x) — no fix exists short of Tauri moving to gtk4. Linux-only
# link deps; the shipped Python image doesn't carry them. Documented in SECURITY.md. Re-check when
# tauri bumps its gtk-rs floor.

