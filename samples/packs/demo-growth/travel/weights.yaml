# Demo Growth — a FICTIONAL travel-lane weights file (sample weight pack).
#
# Generic ranking weights for a demo home base. Every field not set here falls back to the built-in
# WeightConfig defaults — this file only overrides the few that should be neutral/generic for a sample
# (no personal home-airport thumb, a generic home city, a handful of destination mappings). Replace
# with your own home + preferences when you build a real pack.


flight:
  # The home-airport convenience bonus is personal; the generic sample keeps it neutral (no thumb).
  home_airport: ""
  comparison_airport: DEN
  home_airport_note: ""
  home_airport_bonus: 0.0
  home_airport_served_iata: []
  hour_soft_cap: 5.0
  over_cap_penalty_per_hour: 8.0
  airline_avoid_iata: []

# Keyless weather/air conditions watch runs against `home`. Generic demo city.
conditions:
  home: "Denver, CO"
  horizon_days: 3

# Example event-interest tiering: the only leagues worth building a trip AROUND (everything else is
# perk-tier — surfaced, never the anchor). Edit to taste.
events:
  centerpiece_subgenres: ["NBA", "NFL"]
  # Followed teams whose static schedules the reference almanac surfaces (config-drives the schedule
  # parser). Example: a fictional NFL fandom for the demo persona.
  followed_teams:
    - {name: Surge, section_match: surge, home_venue: "Austin, TX"}

# Destination slug -> gateway airport / city, for the trips referenced in this pack.
destination_airports:
  portland: PDX
  moab: CNY
  austin: AUS
  santa-fe: SAF
  las-vegas: LAS
  mexico-city: MEX
destination_cities:
  portland: "Portland, OR"
  moab: "Moab, UT"
  austin: "Austin, TX"
  santa-fe: "Santa Fe, NM"
  las-vegas: "Las Vegas, NV"
  mexico-city: "Mexico City, MX"

# The proactive-nudge registry (the Planning tab's nudge cards). FICTIONAL sample entries for the
# demo-growth persona (Denver home base): budget long weekends, drivable first.
destination_nudge:
  moab:       {best_windows: [4,5,9,10], drive_hours: 5.5, base_fit: 8,
               nudge_hooks: [{when: long_weekend, text: "the drive-and-camp default — shoulder season keeps the crowds and the heat down"}]}
  santa-fe:   {best_windows: [5,6,9,10,12], drive_hours: 6.0, flight_hours: 1.5, base_fit: 7,
               nudge_hooks: [{when: long_weekend, text: "green chile and a cheap flight — the easiest culture weekend from here"}]}
  austin:     {best_windows: [3,4,10,11], flight_hours: 2.0, base_fit: 7,
               nudge_hooks: [{when: long_weekend, text: "live music every night of a long weekend; spring and fall only"}]}
  las-vegas:  {best_windows: [3,4,5,10,11], flight_hours: 2.0, base_fit: 6}
  portland:   {best_windows: [6,7,8,9], flight_hours: 2.5, base_fit: 7}
  mexico-city: {best_windows: [2,3,4,10,11], flight_hours: 4.0, base_fit: 8,
               nudge_hooks: [{when: long_weekend, text: "the best-value big city on a direct flight — four days is enough"}]}
