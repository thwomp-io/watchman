# Early Retiree — a FICTIONAL travel-lane weights file (sample weight pack). Premium-leaning, time-rich.
flight:
  home_airport: ""
  comparison_airport: PHX
  home_airport_note: ""
  home_airport_bonus: 0.0
  home_airport_served_iata: []
  hour_soft_cap: 9.0          # retired + time-rich: long hauls are fine for the right destination
  over_cap_penalty_per_hour: 2.5
  airline_avoid_iata: []
conditions:
  home: "Scottsdale, AZ"
  horizon_days: 3
lodging:
  prefer_best_available_in_area: true
  top_tier_available_bonus: 14.0
events:
  centerpiece_subgenres: ["MLB", "NBA"]
  followed_teams:
    - {name: Diamondbacks, section_match: diamondbacks, home_venue: "Phoenix, AZ"}
destination_airports:
  sedona: FLG
  san-diego: SAN
  santa-barbara: SBA
  kauai: LIH
  charleston: CHS
  lisbon: LIS
destination_cities:
  sedona: "Sedona, AZ"
  san-diego: "San Diego, CA"
  santa-barbara: "Santa Barbara, CA"
  kauai: "Lihue, HI"
  charleston: "Charleston, SC"
  lisbon: "Lisbon, PT"

# The proactive-nudge registry (the Planning tab's nudge cards). FICTIONAL sample entries for the
# early-retiree persona (Scottsdale home base): the calendar is open, so windows are about season.
destination_nudge:
  sedona:        {best_windows: [3,4,5,10,11], drive_hours: 2.0, base_fit: 8,
                  nudge_hooks: [{when: weekend, text: "two hours up the road — the standing midweek-or-weekend reset"}]}
  san-diego:     {best_windows: [5,6,7,8,9,10], flight_hours: 1.5, base_fit: 8,
                  nudge_hooks: [{when: long_weekend, text: "the summer escape from the desert heat — coastal 70s all week"}]}
  santa-barbara: {best_windows: [4,5,9,10], flight_hours: 1.5, base_fit: 7}
  kauai:         {best_windows: [1,2,3,4,11,12], flight_hours: 6.5, base_fit: 9,
                  nudge_hooks: [{when: long_weekend, text: "the place the year is planned around; two weeks, not four days"}]}
  charleston:    {best_windows: [3,4,5,10,11], flight_hours: 4.0, base_fit: 7}
  lisbon:        {best_windows: [4,5,6,9,10], flight_hours: 13.0, base_fit: 8}
