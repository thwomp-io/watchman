    fwd_eps: 7.40
    eps_basis: "GAAP diluted, next twelve months — trailing four quarters plus mid-single-digit growth"
    growth_pct_low: 5
    growth_pct_high: 10
    mult_low: 26
    mult_mid: 30
    mult_high: 34
    ref_price: 229.80
    as_of: 2026-08-14
    provenance: finance/research/prints/AAPL-2026-07-30.md
    notes: >-
      Premium-quality slow grower: the band assumes services mix keeps lifting margin while
      hardware stays flat. The multiple band is what the market has paid across the last two
      years, nothing more generous. Re-anchor at the fiscal Q4 print in late October.
