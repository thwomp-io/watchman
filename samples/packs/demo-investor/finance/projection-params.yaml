# Scenario-projection params — the thin machine layer behind `hn finance projections` and the
# Finance ▸ Projections / Holdings tabs (FICTIONAL sample data for the demo-investor persona;
# illustrative only, not advice).
#
# Every entry is authored at research/grade time from a named research artifact (provenance) and
# carries its own honesty: eps_basis names the accounting basis, the growth and multiple bands are
# deliberate judgment calls, as_of drives the staleness flag. The verb runs the arithmetic
# (price = EPS × (1+growth)^h × multiple) against the live quote; it never forecasts.

projections:
