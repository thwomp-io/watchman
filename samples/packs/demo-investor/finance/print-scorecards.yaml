# grade time; the full narrative record stays in the card markdown (card_doc = the click-through).
# grade enum: GREAT | GOOD | OK | BAD | DISASTER | PENDING
# price_reaction: print-day move % (PENDING = null). Read by `hn finance scorecards`.

