[project]
name = "harness"
version = "0.13.0"
description = "A personal agentic-harness toolkit — one CLI of domain lanes (finance, career, travel). Provider-abstracted, corpus-aware, exposed via MCP + CLI."
requires-python = ">=3.12"
dependencies = [
    "serpapi",
    # <2: mcp 2.x renamed FastMCP (every mcp_server.py imports it). `uv tool install` resolves from
    # this list, not uv.lock, so the ceiling has to live here for the installed harness-mcp too.
    "mcp[cli]>=1.30,<2",
    "typer",
    "rich",
    "pydantic",
    "pydantic-settings",
    "python-frontmatter",
    "jinja2",
    "httpx",
    "pyyaml",
    "pillow",
    "tzdata>=2026.2",
    # bus server (hn bus serve) — both already ride mcp[cli]; declared so the dependency is
    # honest rather than transitive-by-luck. Zero growth to the installed tree.
    "starlette",
    "uvicorn",
    # web push (harness.bus.push) — VAPID ES256 JWT + aes128gcm payload encryption. The one
    # deliberate library-over-primitives call in the bus: this is crypto, never hand-rolled.
    "pywebpush>=2.3.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
harness = "harness.cli:app"
hn = "harness.cli:app"
harness-mcp = "harness.mcp_server:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-mock",
    "respx",
    "ruff",
    "mypy",
    "types-PyYAML",
    "hypothesis>=6.168.3",
]
# Provider posture per domain (the abstraction stays so a viable alternative could slot in later):
#   travel  — SerpAPI sole provider. Amadeus (free tier decommissioned 2026-07-17) + Duffel
#             (enterprise-only) were both evaluated + dropped as non-viable for an individual dev.
#   finance — Alpaca sole market-data provider (free: real-time IEX + 15-min-delayed SIP). READ-ONLY
#             by design; programmatic trading/execution is deliberately out of scope.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
markers = [
    "live: hits a real API; deselected by default, run with `pytest -m live` (keys from the harness .env)",
]
testpaths = ["tests"]
# Upstream Starlette test-client deprecations (not ours); filtered by message so new ones surface.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
# importlib mode: same-basename test files across lanes without __init__.py packages.
# Live tests are deselected unless asked for: `uv run pytest -m live`.
addopts = "--import-mode=importlib -m 'not live'"

[tool.ruff]
line-length = 120  # shared harness convention
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# typer's documented pattern uses these as parameter defaults (they return sentinels, not shared
# mutable state) — exempt from B008, incl. for list/dict-typed options (e.g. a repeatable --city).
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
packages = ["harness"]
strict = true

[[tool.mypy.overrides]]
module = ["serpapi", "serpapi.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["PIL", "PIL.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pywebpush", "pywebpush.*", "py_vapid", "py_vapid.*"]
ignore_missing_imports = true
