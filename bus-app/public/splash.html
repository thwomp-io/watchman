<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watchman</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; height: 100vh; display: grid; place-items: center;
      background: #0b0d10; color: #c9ced6;
      font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.12em;
    }
    .box { text-align: center; }
    .mark { color: #e5484d; font-size: 14px; letter-spacing: 0.32em; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #e5484d;
           margin-right: 10px; animation: pulse 1.4s ease-in-out infinite; }
    .note { color: #7c8591; margin-top: 14px; letter-spacing: 0.06em; }
    @keyframes pulse { 50% { opacity: 0.25; } }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark"><span class="dot"></span>WATCHMAN</div>
    <div class="note">Starting the console…</div>
    <div class="note">The first launch prepares the engine and can take a minute or two.</div>
  </div>
</body>
</html>
